{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <meta name="author" content="Mark Otto, Jacob Thornton, and Bootstrap contributors">
  <title>Signin Template · Bootstrap v5.3</title>

  <!-- Bootstrap CSS از CDN -->
	<link rel="stylesheet" href="{% static 'css/css/bootstrap.css' %}" />

  <!-- استایل‌های مخصوص صفحهٔ لاگین -->
	<link rel="stylesheet" href="{% static 'css/css/sign-in.css' %}" />
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">

  <main class="form-signin w-100 m-auto">
    <form class="form-signup" method="post" action="{% url 'accounts:signup' %}">
		{% csrf_token %}
      <img class="mb-4" src="https://getbootstrap.com/docs/5.3/assets/brand/bootstrap-logo.svg" alt="" width="72" height="57">
      <h1 class="h3 mb-3 fw-normal">Please sign un</h1>

      <div class="form-floating">
		<label for="floatingInput">Username:</label>
        <input type="text" name="username" class="form-control" placeholder="Username">
		<label for="floatingPassword">Password:</label>
        <input type="password" name="password1" class="form-control"  placeholder="Password">
		<label for="floatingPassword">Confirm password</label>
        <input type="password" name="password2" class="form-control"  placeholder="Confirm Password">
        
      </div>

      <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
        <label class="form-check-label" for="checkDefault">
          Remember me
        </label>
      </div>
      <button class="btn btn-primary w-100 py-2" type="submit">Sign un</button>
      <p class="mt-5 mb-3 text-body-secondary">&copy; 2017–2026</p>
    </form>
  </main>

  <!-- Bootstrap JS از CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
